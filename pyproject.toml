[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-ml"
version = "0.9.0"
description = "Cost-sensitive fraud detection system with temporal validation, EML optimization, and deployment simulation."
requires-python = ">=3.10"
readme = "README.md"
# Ranges, not exact pins: each environment (Docker py3.10, local py3.14)
# resolves compatible versions. Floors are the oldest versions the project
# is known to work with.
dependencies = [
    "numpy>=2.0",
    # pandas 3.0 changes string dtype/CoW defaults; the codebase is pandas-2
    # idiomatic (object-dtype categorical detection) — cap until migrated.
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",       # FastAPI TestClient transport
    "ruff>=0.9",
    "pre-commit>=4.0",
]
notebooks = [
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
# Kaggle CLI for pushing/publishing notebooks (Phases 8-10). Auth uses the
# new-style KGAT_ token as a bearer via the KAGGLE_API_TOKEN env var — the
# kaggle.json username/key basic-auth flow does NOT work with that token type.
kaggle = [
    "kaggle>=1.6",
]

# The project is always run from the repository root (editable install or
# PYTHONPATH): src/utils/config.py derives PROJECT_ROOT from __file__, so a
# regular (non-editable) site-packages install would break artifact paths.
[tool.setuptools.packages.find]
include = ["src*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "app"]
