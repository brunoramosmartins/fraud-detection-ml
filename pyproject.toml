[project]
name = "fraud-detection-ml"
version = "0.7.0"
description = "Cost-sensitive fraud detection system with temporal validation, EML optimization, and deployment simulation."
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "app"]
